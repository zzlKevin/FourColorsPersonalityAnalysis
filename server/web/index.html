<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>性格色彩测试</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FAF7F2'/%3E%3Ccircle cx='22' cy='22' r='10' fill='%23E8837A'/%3E%3Ccircle cx='42' cy='22' r='10' fill='%23E3B04B'/%3E%3Ccircle cx='22' cy='42' r='10' fill='%237FB99A'/%3E%3Ccircle cx='42' cy='42' r='10' fill='%237FA3D1'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#FAF7F2;
    --card:#FFFFFF;
    --ink:#3F3A34;
    --ink-2:#6A625A;
    --muted:#9A9186;
    --line:#EFE8DF;
    --line-2:#E3D9CC;
    --primary:#4F4A44;
    --primary-d:#3C3833;
    --red:#E8837A;   --red-soft:#FDEEEC;
    --yellow:#E3B04B; --yellow-soft:#FCF3E1;
    --blue:#7FA3D1;  --blue-soft:#EAF1FA;
    --green:#7FB99A; --green-soft:#E9F5EE;
    --radius:18px;
    --shadow:0 10px 30px rgba(158,138,116,.10);
    --shadow-s:0 4px 14px rgba(158,138,116,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
      "Source Han Sans SC","Noto Sans CJK SC",sans-serif;
    color:var(--ink);
    background-color:var(--bg);
    background-image:
      radial-gradient(680px 420px at 6% -8%, rgba(232,131,122,.13), transparent 62%),
      radial-gradient(560px 400px at 98% 0%, rgba(227,176,75,.16), transparent 60%),
      radial-gradient(620px 460px at 92% 88%, rgba(127,163,209,.13), transparent 62%),
      radial-gradient(560px 400px at 2% 98%, rgba(127,185,154,.15), transparent 60%);
    background-attachment:fixed;
    min-height:100vh;
    line-height:1.75;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1 0 auto;padding-bottom:8px}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px 10px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);letter-spacing:.4px}
  .brand .dots{display:flex;gap:3px}
  .brand .dots i{width:7px;height:7px;border-radius:50%;display:block}
  .adminbtn{
    border:1px solid var(--line-2);background:rgba(255,255,255,.7);color:var(--ink-2);
    font-size:12.5px;padding:7px 13px;border-radius:999px;cursor:pointer;font-family:inherit;
    transition:.2s;backdrop-filter:blur(6px);white-space:nowrap;
  }
  .adminbtn:hover{background:#fff;border-color:#CFC3B3;color:var(--ink)}

  /* ---------- 通用 ---------- */
  .screen{display:none}
  .screen.on{display:block;animation:fadeUp .42s cubic-bezier(.22,.7,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:22px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;font-size:15px;font-weight:600;line-height:1;
    padding:14px 22px;border-radius:14px;border:1.5px solid transparent;cursor:pointer;transition:.18s;
  }
  .btn.primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(79,74,68,.20)}
  .btn.primary:hover{background:var(--primary-d);transform:translateY(-1px);box-shadow:0 10px 24px rgba(79,74,68,.26)}
  .btn.primary:active{transform:translateY(0)}
  .btn.ghost{background:#fff;border-color:var(--line-2);color:var(--ink-2)}
  .btn.ghost:hover{border-color:#CFC3B3;color:var(--ink);background:#FDFBF8}
  .btn:disabled{opacity:.42;cursor:not-allowed;transform:none!important;box-shadow:none}
  .btn.block{width:100%}
  .linkbtn{background:none;border:none;color:var(--muted);font-family:inherit;font-size:13.5px;cursor:pointer;padding:6px 2px}
  .linkbtn:hover{color:var(--ink)}

  /* ---------- 首页 ---------- */
  .hero-home{padding:26px 4px 6px;text-align:center}
  .hero-home .en{font-size:11px;letter-spacing:3px;color:#B9AE9F;text-transform:uppercase;margin-bottom:14px}
  .hero-home h1{font-size:32px;line-height:1.3;margin:0 0 12px;font-weight:800;letter-spacing:1px}
  .hero-home h1 em{
    font-style:normal;white-space:nowrap;
    background-image:linear-gradient(90deg,rgba(232,131,122,.34),rgba(227,176,75,.34),rgba(127,185,154,.34),rgba(127,163,209,.34));
    background-repeat:no-repeat;
    background-size:100% 7px;
    background-position:0 100%;
    padding:0 3px;border-radius:2px;
  }
  .hero-home .company{font-size:13px;color:var(--muted);letter-spacing:.3px}
  .hero-home .intro{font-size:14.5px;color:var(--ink-2);max-width:520px;margin:16px auto 0;line-height:1.9}
  .swatches{display:flex;justify-content:center;gap:14px;margin:26px 0 4px}
  .sw{width:52px;text-align:center}
  .sw i{display:block;width:52px;height:52px;border-radius:18px;box-shadow:0 8px 18px rgba(158,138,116,.18);position:relative}
  .sw i::after{content:"";position:absolute;inset:0;border-radius:18px;border:1px solid rgba(255,255,255,.5)}
  .sw span{display:block;font-size:11px;color:var(--muted);margin-top:8px;white-space:nowrap;letter-spacing:.2px}
  .sw:nth-child(1) i{background:linear-gradient(145deg,#F09A92,#E2756B)}
  .sw:nth-child(2) i{background:linear-gradient(145deg,#EFC36B,#DDA53C)}
  .sw:nth-child(3) i{background:linear-gradient(145deg,#90B5DC,#6C93C6)}
  .sw:nth-child(4) i{background:linear-gradient(145deg,#96C9AC,#6BA987)}

  .startcard{margin-top:26px;display:flex;flex-direction:column;gap:12px}
  .field{display:flex;flex-direction:column;gap:7px}
  .field label{font-size:12.5px;color:var(--muted);letter-spacing:.4px;padding-left:2px}
  input[type=text],input[type=password]{
    width:100%;font-family:inherit;font-size:15px;color:var(--ink);
    padding:13px 15px;border-radius:13px;border:1.5px solid var(--line);
    background:#FDFBF8;outline:none;transition:.18s;
  }
  input[type=text]:focus,input[type=password]:focus{border-color:#CFC3B3;background:#fff;box-shadow:0 0 0 4px rgba(207,195,179,.18)}
  input::placeholder{color:#BFB5A8}

  .keyzone{margin-top:18px;background:rgba(255,255,255,.62);border:1px dashed var(--line-2);border-radius:16px;padding:16px}
  .keyzone .kh{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .keyrow{display:flex;gap:9px}
  .keyrow input{flex:1}
  .keyrow .btn{padding:13px 16px;font-size:14px;flex:0 0 auto}

  .tips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
  .tip{font-size:12px;color:var(--muted);background:rgba(255,255,255,.7);border:1px solid var(--line);padding:6px 12px;border-radius:999px}

  /* ---------- 答题 ---------- */
  .qhead{padding:14px 2px 16px}
  .qmeta{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:10px;letter-spacing:.4px}
  .qmeta b{color:var(--ink);font-size:16px;font-weight:800;margin:0 3px}
  .qbar{height:6px;border-radius:99px;background:#EDE6DC;overflow:hidden}
  .qbar span{display:block;height:100%;width:0;border-radius:99px;transition:width .34s cubic-bezier(.3,.8,.3,1);
    background:linear-gradient(90deg,var(--red),var(--yellow) 34%,var(--green) 68%,var(--blue))}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 22px 20px}
  .qtext{font-size:17.5px;font-weight:700;line-height:1.65;margin-bottom:18px;letter-spacing:.2px}
  .qtext .qi{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--primary);
    border-radius:8px;padding:2px 8px;margin-right:9px;vertical-align:2px;letter-spacing:1px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:#FDFBF8;border:1.5px solid var(--line);border-radius:14px;
    padding:13px 15px;font-family:inherit;font-size:14.5px;line-height:1.7;color:#4E4740;
    cursor:pointer;transition:.16s;
  }
  .opt:hover{border-color:#D9CDBD;background:#fff;transform:translateY(-1px);box-shadow:0 6px 16px rgba(158,138,116,.09)}
  .opt .k{flex:0 0 25px;height:25px;border-radius:50%;background:#F1EAE0;color:#8E8375;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;transition:.16s;margin-top:1px}
  .opt.sel{border-color:#9E9081;background:#FBF6EE;box-shadow:0 8px 18px rgba(158,138,116,.14)}
  .opt.sel .k{background:var(--primary);color:#fff}
  .navrow{display:flex;gap:10px;margin-top:18px}
  .navrow .btn{flex:1}
  .kbdhint{text-align:center;font-size:11.5px;color:#B9AE9F;margin-top:14px}

  /* ---------- 结果 ---------- */
  .res-top{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 14px;gap:10px}
  .res-time{font-size:12px;color:var(--muted)}
  .hero{border-radius:22px;padding:24px 22px;position:relative;overflow:hidden;
    border:1px solid var(--line);box-shadow:var(--shadow);
    background:linear-gradient(135deg,var(--soft) 0%,#FFFFFF 72%)}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
    background:var(--accent);opacity:.13;filter:blur(2px)}
  .hero .hk{font-size:11.5px;letter-spacing:3px;color:var(--muted);margin-bottom:8px}
  .hero .ht{font-size:24px;font-weight:800;line-height:1.35;display:flex;align-items:center;gap:10px}
  .hero .ht i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.8)}
  .hero .hsub{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.8}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

  /* 报告密码卡片 */
  .keycard{margin-top:12px;background:#FFFDF7;border:1px dashed #E0CFA8;border-radius:16px;
    padding:13px 16px;display:flex;align-items:center;gap:12px}
  .keycard .kcol{flex:1;min-width:0}
  .keycard .klabel{font-size:11.5px;color:#A08A55;letter-spacing:1px}
  .keycard .kval{font-size:24px;font-weight:800;letter-spacing:7px;color:#8A6D1F;
    font-family:ui-monospace,Menlo,Consolas,monospace;margin:1px 0 2px}
  .keycard .khint{font-size:11px;color:#B49A62}
  .keycard .mini{flex:0 0 auto}
  .tag{font-size:12px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.85);
    border:1px solid rgba(255,255,255,.9);color:var(--ink-2);box-shadow:0 2px 8px rgba(158,138,116,.08)}

  .card + .card,.hero + .card{margin-top:16px}
  .h3{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;margin:0 0 14px;letter-spacing:.3px}
  .h3::before{content:"";width:4px;height:15px;border-radius:99px;background:var(--accent,#C9BDAC)}
  .chartbox{position:relative}
  #chart{display:block;width:100%;height:230px}
  .score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
  .sc{background:#FDFBF8;border:1px solid var(--line);border-radius:13px;padding:11px 6px;text-align:center}
  .sc .n{font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
  .sc .n i{width:7px;height:7px;border-radius:50%;display:block}
  .sc .v{font-size:20px;font-weight:800;line-height:1.3;margin-top:2px}
  .sc .v small{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
  .sc.top{border-color:#DCD0C0;background:#FBF6EE}

  .body p{margin:0 0 12px;font-size:14.5px;color:#4E4740;line-height:1.95;text-align:justify}
  .body p:last-child{margin-bottom:0}
  ul.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  ul.plist li{position:relative;padding-left:22px;font-size:14.5px;color:#4E4740;line-height:1.8}
  ul.plist li::before{content:"";position:absolute;left:4px;top:10px;width:7px;height:7px;border-radius:2px;
    background:var(--accent,#C9BDAC);opacity:.85;transform:rotate(45deg)}

  .actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .actions .row{display:flex;gap:10px}
  .actions .row .btn{flex:1}
  .actions .minor{display:flex;justify-content:center;gap:18px;margin-top:2px}

  /* ---------- 管理员 ---------- */
  .adm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;gap:10px}
  .adm-title{font-size:19px;font-weight:800;letter-spacing:.3px}
  .adm-title small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
  .adm-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .adm-tools .btn{padding:9px 14px;font-size:13px;border-radius:11px}
  .rlist{display:flex;flex-direction:column;gap:10px}
  .row-item{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px 14px;
    box-shadow:var(--shadow-s);display:flex;align-items:center;gap:12px}
  .avat{flex:0 0 38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:800;color:#fff;letter-spacing:0}
  .rmain{flex:1;min-width:0}
  .rname{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rname .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;line-height:1.6}
  .rsub{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
  .rkey{margin-top:6px;font-size:12px;color:#8A6D1F;background:#FFFDF7;border:1px dashed #E0CFA8;
    border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rkey b{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2.5px;font-size:14px}
  .rkey .kcopy{padding:3px 9px;font-size:11px}
  .racts{display:flex;gap:6px;flex-wrap:wrap}
  .mini{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-family:inherit;
    font-size:11.5px;padding:6px 10px;border-radius:9px;cursor:pointer;transition:.16s;white-space:nowrap}
  .mini:hover{background:#FBF6EE;border-color:#CFC3B3;color:var(--ink)}
  .mini.danger:hover{background:#FDEEEC;border-color:#EFC3BE;color:#C2695F}
  .empty{text-align:center;padding:56px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
  .empty p{font-size:13.5px;margin:0}

  /* ---------- 弹窗 / 提示 ---------- */
  .mask{position:fixed;inset:0;background:rgba(58,52,46,.34);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
  .mask.on{display:flex;animation:fade .2s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:20px;padding:24px 22px;width:100%;max-width:380px;
    box-shadow:0 24px 60px rgba(58,52,46,.24);animation:pop .26s cubic-bezier(.2,.9,.3,1.1) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal h4{margin:0 0 6px;font-size:17px;font-weight:800}
  .modal p.sub{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.7}
  .modal .mrow{display:flex;gap:10px;margin-top:16px}
  .modal .mrow .btn{flex:1;padding:12px 16px;font-size:14px}
  .shake{animation:shake .38s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

  .toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-16px);z-index:90;
    background:rgba(58,52,46,.94);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:12px;
    box-shadow:0 12px 30px rgba(58,52,46,.28);opacity:0;pointer-events:none;transition:.26s;max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 页脚 ---------- */
  footer{flex:0 0 auto;padding:32px 0 26px;text-align:center}
  footer .fline{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#A79C8E;
    background:rgba(255,255,255,.66);border:1px solid var(--line);padding:7px 14px;border-radius:999px;line-height:1.6}
  footer .fline svg{flex:0 0 auto;opacity:.7}
  footer .copy{font-size:11px;color:#C0B6A8;margin-top:10px;letter-spacing:.6px}

  /* ---------- 打印（PDF） ---------- */
  #printRoot{display:none}

  @media print{
    @page{size:A4;margin:14mm 13mm}
    html,body{background:#fff!important;background-image:none!important;min-height:0!important;height:auto!important}
    .wrap,.toast,.mask{display:none!important}
    #printRoot{
      display:block!important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    #printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

  @media (max-width:520px){
    body{font-size:14.5px}
    .wrap{padding:0 14px}
    .hero-home{padding:16px 2px 4px}
    .hero-home h1{font-size:26px}
    .hero-home .intro{font-size:13.5px;margin-top:14px}
    .sw{width:44px}
    .sw i{width:44px;height:44px;border-radius:15px}
    .qcard{padding:18px 15px 16px;border-radius:17px}
    .qtext{font-size:16px;margin-bottom:14px}
    .opt{padding:12px 13px;font-size:14px;gap:10px}
    .hero{padding:20px 17px}
    .hero .ht{font-size:20px}
    .card{padding:18px 16px;border-radius:16px}
    #chart{height:200px}
    .score-grid{gap:7px}
    .sc .v{font-size:17px}
    .row-item{flex-wrap:wrap}
    .racts{width:100%;justify-content:flex-end;margin-top:2px}
    .actions .row{flex-direction:column}
    .keyrow{flex-wrap:wrap}
    .keyrow .btn{width:100%}
  }

  /* ============ 新版报告样式（含相处与职场建议） ============ */
  .hero2{position:relative;overflow:hidden;border-radius:22px;padding:24px 22px;display:flex;align-items:center;gap:16px;
    background:var(--hc-soft,#F3EDE4);border:1px solid rgba(255,255,255,.65);box-shadow:var(--shadow-s)}
  .hero2::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:var(--hc);opacity:.14}
  .hero2 .mark{width:54px;height:54px;border-radius:16px;background:var(--hc);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;flex:0 0 auto;box-shadow:0 8px 18px rgba(93,78,60,.16);position:relative;z-index:1}
  .hero2 .hmain{min-width:0;position:relative;z-index:1}
  .hero-label{font-size:11.5px;letter-spacing:2px;color:var(--hc-deep,#6A625A);font-weight:700}
  .hero-title{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:.5px}
  .hero-desc{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.65}
  .hero-score{margin-left:auto;text-align:right;flex:0 0 auto;position:relative;z-index:1}
  .hero-score b{display:block;font-size:32px;font-weight:800;line-height:1;color:var(--hc-deep,#6A625A)}
  .hero-score span{font-size:11.5px;color:var(--muted)}
  .card h3{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:800;margin:0 0 14px;letter-spacing:.3px}
  .card h3::before{content:"";width:5px;height:15px;border-radius:3px;background:var(--hc,#C9BDAC)}
  .card h3 .sub{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
  .score-list{display:flex;flex-direction:column;gap:11px;margin-top:16px}
  .score-item{display:flex;align-items:center;gap:10px}
  .score-item .nm{flex:0 0 52px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:600}
  .score-item .nm i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}

   · 离线双击打开：首次进入后台时自行设置密码，仅以 SHA-256 哈希存在本浏览器。 */
const ADMIN_LS_KEY = "fpa_admin_pwd_sha256";

   SERVER 为 null（直接双击打开 HTML）=> 保持原有纯本机行为。 */

}

/* 探测局域网主机（3秒超时，失败1秒后自动重试一次） */
function probeServer(timeout){
  return new Promise(resolve => {
    try{
      const ctrl = new AbortController();
      const timer = setTimeout(()=>{ try{ctrl.abort();}catch(e){} resolve(null); }, timeout || 3000);
      fetch("api/info", {signal: ctrl.signal, cache: "no-store"})
        .then(r => r.ok ? r.json() : null)
        .then(info => { clearTimeout(timer); resolve(info && info.mode === "server" ? info : null); })
        .catch(()=>{ clearTimeout(timer); resolve(null); });
    }catch(e){ resolve(null); }
  });
}
function detectServerNow(){
  return probeServer(3000).then(info => {
    if(info){ SERVER = info; applyServerMode(); return info; }
    return new Promise(resolve => setTimeout(() => {
      probeServer(3000).then(info2 => {
        if(info2){ SERVER = info2; applyServerMode(); }
        resolve(info2 || null);
      });
    }, 1000));
  });
}
(function detectServer(){
  detectServerNow().then(() => restoreAdminSession()).catch(() => restoreAdminSession());
})();

/* 把本机未同步过的记录补传到主机（已同步的用标记跳过，避免覆盖主机删除操作） */
function syncPendingLocal(){
  if(!SERVER) return;
  let pending = [];
  try{ pending = loadRecords().filter(r => !r.synced); }catch(e){ return; }
  if(!pending.length) return;
  pending.forEach(rec => {
    fetch("api/records", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(rec)
    }).then(r => {
      if(!r.ok) throw new Error("status " + r.status);
      return r.json();
    }).then(resp => {
      try{
        const arr = loadRecords().map(r => {
          if(r.id !== rec.id) return r;
          const nr = Object.assign({}, r, {synced: true});
          if(resp && resp.key) nr.key = resp.key;
          return nr;
        });
        saveRecords(arr);
      }catch(e){}
    }).catch(()=>{ /* 主机暂不可达，下次再补传 */ });
  });
}

/* ---------------- 报告密码 ----------------
   每份报告对应一个 6 位密码（去掉易混淆字符）。
   完成测试后展示给本人；管理员可在后台查看并复制发给本人；
   本人在首页输入报告密码即可随时调出自己的详细报告。 */
const KEY_CHARS = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";
function genKey(){
  let s = "";
  try{
    const rnd = new Uint32Array(6);
    crypto.getRandomValues(rnd);
    for(let i = 0; i < 6; i++) s += KEY_CHARS[rnd[i] % KEY_CHARS.length];
  }catch(e){
    for(let i = 0; i < 6; i++) s += KEY_CHARS[Math.floor(Math.random() * KEY_CHARS.length)];
  }
  return s;
}

function copyText(t){
  const done = () => toast("已复制");
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
      return;
    }
  }catch(e){}
  fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.cssText = "position:fixed;opacity:0;left:-999px";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    done();
  }catch(e){ toast("复制失败，请手动抄写"); }
}

/* ---------------- 管理员密码校验 ---------------- */
async function sha256Hex(t){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
/* 服务模式 => 交由主机 config.json 校验；离线模式 => 与本浏览器保存的哈希比对 */
async function tryAdminLogin(pwd){
  if(SERVER){
    try{
      const r = await fetch("api/records", {cache: "no-store", headers: {"X-Admin-Pwd": pwd}});
      return r.ok; // 200=正确；401=错误；其他状态同样视为失败
    }catch(e){ return false; }
  }
  const h = localStorage.getItem(ADMIN_LS_KEY);
  if(!h) return false;
  try{ return (await sha256Hex(pwd)) === h; }catch(e){ return false; }
}
/* 登录状态记忆：刷新页面自动恢复，关闭标签页才失效 */
function rememberAdmin(pwd){
  try{ sessionStorage.setItem(ADMIN_SESSION_KEY, pwd); }catch(e){}
}
function forgetAdmin(){
  try{ sessionStorage.removeItem(ADMIN_SESSION_KEY); }catch(e){}
}
function restoreAdminSession(){
  let saved = "";
  try{ saved = sessionStorage.getItem(ADMIN_SESSION_KEY) || ""; }catch(e){}
  if(!saved) return;
  tryAdminLogin(saved).then(ok => {
    if(!ok){ forgetAdmin(); return; }
    adminPwd = saved;
    viewerMode = "admin";
    renderAdminList();
    show("screen-admin");
    toast("已自动恢复管理员登录");

}

function openRecord(rec, label){

function lookupByKey(code){
  const findLocal = () => loadRecords().find(r => String(r.key || "").toUpperCase() === code);
  const showLocal = () => {
    const rec = findLocal();
    if(rec){ openRecord(rec); return true; }
    return false;
  };
  if(SERVER){
    fetch("api/records/bykey/" + encodeURIComponent(code), {cache: "no-store"})
      .then(r => {
        if(r.status === 404) throw new Error("notfound");
        if(!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      .then(rec => openRecord(rec))
      .catch(e => {
        if(e.message === "notfound"){
          if(showLocal()) return;
          toast("未找到该报告密码对应的报告，请核对后重试");
        }else{
          if(showLocal()) return;
          toast("查询失败，无法连接主机");
        }
      });
    return;
  }
  if(!showLocal()) toast("未找到该报告密码对应的报告，请核对后重试");
}

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function loadRecords(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveRecords(arr){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); return true; }
  catch(e){ toast("本地存储不可用，记录未能保存"); return false; }
}
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function pad2(n){ return n < 10 ? "0" + n : "" + n; }
function fmtTime(ts){
  const d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) +
         " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function fileStamp(ts){
  const d = new Date(ts);
  return d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
}

   答题
   ========================================================= */
function renderQuestion(){
  const q = QUESTIONS[cur];
  $("#qnow").textContent = cur + 1;
  const pct = Math.round(((cur + 1) / QUESTIONS.length) * 100);
  $("#qpct").textContent = pct + "%";
  $("#qfill").style.width = pct + "%";

  $("#qtext").innerHTML = '<span class="qi">' + pad2(cur + 1) + '</span>' + esc(q.q);

  const box = $("#opts");
  box.innerHTML = "";
  q.o.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt" + (answers[cur] === LETTERS[i] ? " sel" : "");
    btn.innerHTML = '<span class="k">' + LETTERS[i] + '</span><span class="t">' + esc(text) + '</span>';
    btn.addEventListener("click", () => {
      answers[cur] = LETTERS[i];
      $$(".opt", box).forEach(b => b.classList.remove("sel"));
      btn.classList.add("sel");
      // 轻微延迟后自动进入下一题，体验更顺
      if(cur < QUESTIONS.length - 1){
        setTimeout(() => { if(answers[cur] === LETTERS[i]){ cur++; renderQuestion(); } }, 220);
      }
    });
    box.appendChild(btn);
  });

  $("#btnPrev").disabled = cur === 0;
  const next = $("#btnNext");
  next.textContent = cur === QUESTIONS.length - 1 ? "提交并查看报告" : "下一题";
  next.classList.toggle("primary", true);

  window.scrollTo(0, 0);
}

$("#btnPrev").addEventListener("click", () => {
  if(cur > 0){ cur--; renderQuestion(); }
});
$("#btnNext").addEventListener("click", () => {
  if(!answers[cur]){ toast("请先选择一个最符合你的选项"); return; }
  if(cur < QUESTIONS.length - 1){ cur++; renderQuestion(); return; }
  submitTest();
});

/* ---------------- 计分 ---------------- */
function calcScores(ans){
  const s = {red:0, blue:0, yellow:0, green:0};
  for(let i = 0; i < ans.length; i++){
    const a = ans[i];
    if(i < 15){
      // 1-15 题：A红 B蓝 C黄 D绿
      if(a === "A") s.red++;
      else if(a === "B") s.blue++;
      else if(a === "C") s.yellow++;
      else if(a === "D") s.green++;
    }else{
      // 16-30 题：D红 C蓝 B黄 A绿
      if(a === "D") s.red++;
      else if(a === "C") s.blue++;
      else if(a === "B") s.yellow++;
      else if(a === "A") s.green++;
    }
  }
  return s;
}

/* 主导判定（含并列检测）与得分水平分级 */
function pickDominant(scores){
  const sorted = DIMS.map(d => d.key).sort((a,b) => scores[b] - scores[a]);
  const top = scores[sorted[0]];
  const tied = DIMS.map(d => d.key).filter(k => scores[k] === top);
  return { first: sorted[0], second: sorted[1], top: top, tie: tied.length > 1, tiedKeys: tied };
}
function levelOf(score){
  if(score >= 12) return "显著主导";
  if(score >= 9)  return "明显倾向";
  if(score >= 5)  return "中等水平";
  if(score >= 1)  return "相对较弱";
  return "几乎没有";
}

function submitTest(){
  const miss = answers.findIndex(a => !a);
  if(miss > -1){
    cur = miss;
    renderQuestion();
    toast("还有第 " + (miss + 1) + " 题未作答");
    return;
  }
  const scores = calcScores(answers);
  const sorted = Object.keys(scores).sort((a,b) => scores[b] - scores[a]);
  const rec = {
    id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: $("#inpName").value.trim() || "匿名",
    time: Date.now(),
    scores: scores,
    primary: sorted[0],
    secondary: sorted[1],
    answers: answers.slice(),
    key: genKey()
  };
  const all = loadRecords();
  all.unshift(rec);
  saveRecords(all);

  // 局域网服务模式：把记录同步到主机（失败不影响本机保存）
  const markSynced = (resp) => {
    try{
      const arr = loadRecords().map(r => {
        if(r.id !== rec.id) return r;
        const nr = Object.assign({}, r, {synced: true});
        if(resp && resp.key) nr.key = resp.key;
        return nr;
      });
      saveRecords(arr);
    }catch(e){}
  };
  if(SERVER){
    fetch("api/records", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(rec)
    }).then(r => {
      if(!r.ok) throw new Error("status " + r.status);
      return r.json();
    }).then(resp => {
      serverRecords = null;
      markSynced(resp);
      // 若主机因重复而生成了新密码，更新本机记录与结果页显示
      if(resp && resp.key && resp.key !== rec.key){
        rec.key = resp.key;
        const el = $("#repKeyVal");
        if(el) el.textContent = rec.key;
      }
    }).catch(() => {
      toast("记录已保存在本机，但同步到主机失败");
    });
  }else{
    // 打开页面时探测失败的设备：提交时再探测一次，成功则连同历史未同步记录一起补传
    detectServerNow().then(info => {
      if(info){ toast("已连接主机，本机记录将自动同步"); }
    }).catch(()=>{});
  }

  viewerMode = "user";
  curRecord = rec;
  renderResult(rec, "user");
  show("screen-result");
}

/* =========================================================
   Canvas 柱状图（内置绘制，无第三方库）
   ========================================================= */
const CANVAS_FONT = '"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif';

function roundRect(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function paintBars(ctx, x, y, w, h, scores, fs){
  fs = fs || 1;
  const MAXV = 30;
  const padL = 34 * fs, padR = 6 * fs, padT = 22 * fs, padB = 34 * fs;
  const px = x + padL, py = y + padT;
  const pw = Math.max(w - padL - padR, 40);
  const ph = Math.max(h - padT - padB, 40);

  ctx.save();
  // 网格
  for(let v = 0; v <= MAXV; v += 5){
    const gy = py + ph - (v / MAXV) * ph;
    ctx.beginPath();
    ctx.strokeStyle = v === 0 ? "#E6DCCF" : "#F2ECE4";
    ctx.lineWidth = 1 * fs;
    ctx.moveTo(px, gy + 0.5);
    ctx.lineTo(px + pw, gy + 0.5);
    ctx.stroke();
    ctx.fillStyle = "#B2A899";
    ctx.font = (10.5 * fs) + "px " + CANVAS_FONT;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(String(v), px - 7 * fs, gy);
  }

  const step = pw / 4;
  const bw = Math.min(step * 0.46, 62 * fs);
  DIMS.forEach((d, i) => {
    const val = scores[d.key] || 0;
    const bh = Math.max((val / MAXV) * ph, val > 0 ? 3 * fs : 0);
    const bx = px + step * i + (step - bw) / 2;
    const by = py + ph - bh;

    if(bh > 0){
      const g = ctx.createLinearGradient(0, by, 0, py + ph);
      g.addColorStop(0, d.c);
      g.addColorStop(1, d.c + "CC");
      ctx.fillStyle = g;
      roundRect(ctx, bx, by, bw, bh, Math.min(7 * fs, bw / 2));
      ctx.fill();
    }

    ctx.fillStyle = "#4A443E";
    ctx.font = "700 " + (13 * fs) + "px " + CANVAS_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    ctx.fillText(String(val), bx + bw / 2, by - 6 * fs);

    ctx.fillStyle = "#8E8478";
    ctx.font = (12 * fs) + "px " + CANVAS_FONT;
    ctx.textBaseline = "top";
    ctx.fillText(d.name, bx + bw / 2, py + ph + 10 * fs);
  });
  ctx.restore();
}

function drawScreenChart(canvas, scores){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = canvas.getBoundingClientRect().width || 460;
  const cssH = canvas.getBoundingClientRect().height || 230;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  paintBars(ctx, 0, 0, cssW, cssH, scores, 1);
}

    const w = c.getBoundingClientRect().width;
    if(w < 40 && (tryCount || 0) < 8){
      setTimeout(() => paintChart((tryCount || 0) + 1), 60);
      return;
    }
    drawScreenChart(c, rec.scores);
  };
  requestAnimationFrame(() => paintChart(0));
  setTimeout(() => paintChart(0), 80);
}


/* =========================================================

   ========================================================= */
function reportLines(rec){
  const p = PROFILES[rec.primary];
  const sec = PROFILES[rec.secondary];
  const dim = DIM_MAP[rec.primary];
  const secDim = DIM_MAP[rec.secondary];
  const order = Object.keys(rec.scores).sort((a,b) => rec.scores[b] - rec.scores[a]);
  const dom = pickDominant(rec.scores);
  return {
    p, sec, dim, secDim, order, dom,
    head: "主导性格：" + p.label + "（" + dim.name + " " + rec.scores[rec.primary] + " 分）",
    subs: order.map(k => DIM_MAP[k].name + " " + rec.scores[k] + " 分").join("　|　"),
    lead: p.lead,
    detail: p.detail,
    extra: "辅助性格：" + secDim.name + " · " + secDim.title + "（" + rec.scores[rec.secondary] +
      " 分）——它让你的" + dim.adj + "之外，多了一层" + secDim.adj + "的底色。"
  };
}

/* =========================================================
   下载：TXT
   ========================================================= */
function downloadBlob(blob, filename){
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1600);
}

function exportTXT(rec){
  const txt = "\ufeff" + buildTXT(rec);
  downloadBlob(new Blob([txt], {type:"text/plain;charset=utf-8"}),
    "性格色彩测试报告_" + rec.name + "_" + fileStamp(rec.time) + ".txt");
  toast("文本报告已开始下载");
}

/* =========================================================
   下载：PNG（纯 Canvas 绘制）
   ========================================================= */
function wrapText(ctx, text, maxW){
  const lines = [];
  let line = "";
  const punct = "，。、；：？！）」』】》,.;:?!)]}%";
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    const test = line + ch;
    if(ctx.measureText(test).width > maxW && line.length > 0){
      if(punct.indexOf(ch) > -1){
        line = test;               // 标点不另起一行
        lines.push(line);
        line = "";
        continue;
      }
      lines.push(line);
      line = ch;
    }else{
      line = test;
    }
  }
  if(line) lines.push(line);
  return lines;
}

function buildReportCanvas(rec){
  const SC = 2;                    // 2 倍清晰度
  const W = 860, HMAX = 3600;
  const PAD = 52;
  const cardW = W - PAD * 2;
  const FONT = CANVAS_FONT;
  const tmp = document.createElement("canvas");
  tmp.width = W * SC; tmp.height = HMAX * SC;
  const ctx = tmp.getContext("2d");
  ctx.scale(SC, SC);

  const r = reportLines(rec);
  const p = r.p, dim = r.dim, secDim = r.secDim;
  const s = rec.scores;

  const card = (x, y0, w, h) => {
    ctx.save();
    ctx.shadowColor = "rgba(93,78,60,.08)";
    ctx.shadowBlur = 16; ctx.shadowOffsetY = 5;
    ctx.fillStyle = "#FFFFFF";
    roundRect(ctx, x, y0, w, h, 18); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#F0E9DF"; ctx.lineWidth = 1;
    roundRect(ctx, x + .5, y0 + .5, w - 1, h - 1, 18); ctx.stroke();
  };
  const cardTitle = (t, sub, color, y0) => {
    ctx.fillStyle = color;
    roundRect(ctx, PAD + 24, y0 + 3, 5, 16, 3); ctx.fill();
    ctx.fillStyle = "#3E3A36";
    ctx.font = "800 17px " + FONT;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText(t, PAD + 40, y0);
    if(sub){
      ctx.fillStyle = "#A99E90"; ctx.font = "400 12px " + FONT;
      const tw = ctx.measureText(t).width;
      ctx.fillText(sub, PAD + 40 + tw + 12, y0 + 4);
    }
    return y0 + 38;
  };

  /* 背景 */
  ctx.fillStyle = "#FBF8F3";
  ctx.fillRect(0, 0, W, HMAX);

  /* 顶部渐变带 */
  const g = ctx.createLinearGradient(0, 0, W, 250);
  g.addColorStop(0, "#FCEFEA"); g.addColorStop(.45, "#FBF5E6");
  g.addColorStop(.78, "#EBF4EF"); g.addColorStop(1, "#EDF2FA");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, 232);

  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.font = "13px " + FONT; ctx.fillStyle = "#8A7F73";
  ctx.fillText("XXX公司", W / 2, 42);
  ctx.font = "700 30px " + FONT; ctx.fillStyle = "#3E3A36";
  ctx.fillText("色彩性格测试报告", W / 2, 70);
  ctx.font = "13px " + FONT; ctx.fillStyle = "#8A7F73";
  const meta = rec.name + "　·　" + fmtTime(rec.time) +
    (rec.key ? "　·　报告密码 " + String(rec.key).toUpperCase() : "");
  ctx.fillText(meta, W / 2, 116);

  let y = 166;

  /* 主导性格卡 */
  const heroH = 108;
  ctx.save();
  ctx.shadowColor = "rgba(93,78,60,.10)"; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillStyle = dim.soft;
  roundRect(ctx, PAD, y, cardW, heroH, 18); ctx.fill();
  ctx.restore();
  ctx.fillStyle = dim.c;
  roundRect(ctx, PAD + 20, y + 27, 54, 54, 14); ctx.fill();
  ctx.fillStyle = "#FFFFFF"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "800 24px " + FONT;
  ctx.fillText(dim.name.charAt(0), PAD + 47, y + 55);
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = dim.deep; ctx.font = "700 11px " + FONT;
  ctx.fillText("主 导 性 格", PAD + 92, y + 20);
  ctx.fillStyle = "#3E3A36"; ctx.font = "800 22px " + FONT;
  ctx.fillText(dim.name + " · " + dim.title, PAD + 92, y + 35);
  ctx.textAlign = "right";
  ctx.fillStyle = dim.deep; ctx.font = "800 32px " + FONT;
  ctx.fillText(String(s[rec.primary]), W - PAD - 14, y + 24);
  ctx.fillStyle = "#9A9186"; ctx.font = "400 12px " + FONT;
  ctx.fillText("/ 30 分", W - PAD - 14, y + 62);
  ctx.textAlign = "left";
  y += heroH + 16;

  /* 并列提示 */
  if(r.dom.tie){
    const names = r.dom.tiedKeys.map(k => DIM_MAP[k].name).join("、");
    const tip = "「" + names + "」得分并列——你是复合型性格，以下解读以「" + dim.name + "」为主展开。";
    ctx.font = "400 13px " + FONT;
    const lines = wrapText(ctx, tip, cardW - 48);
    const h = lines.length * 20 + 24;
    ctx.fillStyle = "#FFFDF7"; ctx.strokeStyle = "#E0CFA8"; ctx.lineWidth = 1;
    roundRect(ctx, PAD, y, cardW, h, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8A6D1F"; ctx.textBaseline = "top";
    lines.forEach((t, i) => ctx.fillText(t, PAD + 24, y + 12 + i * 20));
    y += h + 16;
  }

  /* 四维得分卡 */
  const chartH = 210;
  const rowsH = DIMS.length * 30 + 10;
  const c1h = 40 + chartH + rowsH + 22;
  card(PAD, y, cardW, c1h);
  let cy = cardTitle("四维得分", "每项满分 30 分", dim.c, y + 22);
  paintBars(ctx, PAD + 16, cy, cardW - 32, chartH, s, 1);
  cy += chartH + 14;
  DIMS.forEach(d => {
    const k = d.key;
    const w = Math.max(s[k] / 30, 0.02);
    const rowX = PAD + 26, rowW = cardW - 52;
    ctx.textBaseline = "middle";
    ctx.fillStyle = d.c;
    ctx.beginPath(); ctx.arc(rowX + 4, cy + 10, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3E3A36"; ctx.font = "600 13px " + FONT; ctx.textAlign = "left";
    ctx.fillText(d.name, rowX + 15, cy + 10);
    const trX = rowX + 62, trW = rowW - 62 - 108;
    ctx.fillStyle = "#F3EDE4";
    roundRect(ctx, trX, cy + 6, trW, 8, 4); ctx.fill();
    if(s[k] > 0){
      ctx.fillStyle = d.c;
      roundRect(ctx, trX, cy + 6, Math.max(trW * w, 6), 8, 4); ctx.fill();
    }
    ctx.fillStyle = "#3E3A36"; ctx.font = "800 13px " + FONT; ctx.textAlign = "right";
    ctx.fillText(String(s[k]), trX + trW + 34, cy + 10);
    ctx.fillStyle = "#A99E90"; ctx.font = "400 11px " + FONT;
    ctx.fillText(levelOf(s[k]), trX + trW + 106, cy + 10);
    cy += 30;
  });
  ctx.textBaseline = "top"; ctx.textAlign = "left";
  y += c1h + 16;

  /* 性格解读卡 */
  ctx.font = "400 13.5px " + FONT;
  let leadLines = wrapText(ctx, p.lead, cardW - 48);
  let detailLines = [];
  p.detail.forEach(t => {
    wrapText(ctx, t, cardW - 48).forEach(l => detailLines.push(l));
    detailLines.push("");
  });
  detailLines.pop();
  let extraLines = wrapText(ctx, r.extra, cardW - 48);
  const chipH = 26, chipGap = 8;
  let chipX = PAD + 24, chipRows = 1;
  ctx.font = "600 12px " + FONT;
  p.keywords.forEach(t => {
    const cw = ctx.measureText(t).width + 24;
    if(chipX + cw > PAD + cardW - 24){ chipRows++; chipX = PAD + 24; }
    chipX += cw + chipGap;
  });
  const chipsH = chipRows * (chipH + chipGap) - chipGap;
  const extraBoxH = extraLines.length * 21 + 22;
  const c2h = 40 + chipsH + 14 + leadLines.length * 24 + detailLines.length * 24 +
              extraBoxH + 16 + 22;
  card(PAD, y, cardW, c2h);
  cy = cardTitle("性格解读", dim.title, dim.c, y + 22);
  // 关键词
  ctx.font = "600 12px " + FONT; ctx.textBaseline = "middle"; ctx.textAlign = "center";
  let cx = PAD + 24;
  p.keywords.forEach(t => {
    const cw = ctx.measureText(t).width + 24;
    if(cx + cw > PAD + cardW - 24){ chipRows--; cx = PAD + 24; cy += chipH + chipGap; }
    ctx.fillStyle = dim.soft;
    roundRect(ctx, cx, cy, cw, chipH, 13); ctx.fill();
    ctx.fillStyle = dim.deep;
    ctx.fillText(t, cx + cw / 2, cy + chipH / 2 + 1);
    cx += cw + chipGap;
  });
  cy += chipH + chipGap + 6;
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.font = "400 13.5px " + FONT;
  ctx.fillStyle = "#3E3A36";
  leadLines.forEach(t => { ctx.fillText(t, PAD + 24, cy); cy += 24; });
  cy += 6;
  ctx.fillStyle = "#4E4740";
  detailLines.forEach(t => { if(t){ ctx.fillText(t, PAD + 24, cy); } cy += 24; });
  cy += 8;
  // 辅助性格
  ctx.fillStyle = "#FFFDF7"; ctx.strokeStyle = "#E0CFA8"; ctx.lineWidth = 1;
  roundRect(ctx, PAD + 16, cy, cardW - 32, extraBoxH, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#8A6D1F"; ctx.font = "400 12.5px " + FONT;
  extraLines.forEach((t, i) => ctx.fillText(t, PAD + 30, cy + 11 + i * 21));
  y += c2h + 16;

  /* 优势 / 待改进 双栏 */
  const colW = (cardW - 16) / 2;
  const drawList = (x0, w0, title, items, dotColor, color) => {
    ctx.font = "400 12.5px " + FONT;
    let ly = 0;
    const itemLines = items.map(t => wrapText(ctx, "· " + t, w0 - 52));
    itemLines.forEach(ls => { ly += ls.length * 19 + 9; });
    const bh = 40 + ly + 14;
    card(x0, y, w0, bh);
    cardTitle(title, "", color, y + 22);
    let iy = y + 40 + 6;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    itemLines.forEach(ls => {
      ls.forEach((t, i) => {
        ctx.fillStyle = i === 0 ? dotColor : "#4E4740";
        ctx.font = (i === 0 ? "600 " : "400 ") + "12.5px " + FONT;
        ctx.fillText(t, x0 + 24, iy);
        iy += 19;
      });
      iy += 9;
    });
    return bh;
  };
  const h1 = drawList(PAD, colW, "你的优势", p.strengths, "#528B70", "#7FB99A");
  const h2 = drawList(PAD + colW + 16, colW, "待改进点", p.improve, "#A9822A", "#D9A13B");
  y += Math.max(h1, h2) + 16;

  /* 相处与职场建议卡 */
  ctx.font = "400 13.5px " + FONT;
  const workLines = wrapText(ctx, p.work, cardW - 110);
  const relLines = wrapText(ctx, p.relation, cardW - 110);
  const c4h = 40 + workLines.length * 24 + 34 + relLines.length * 24 + 16 + 22;
  card(PAD, y, cardW, c4h);
  cy = cardTitle("相处与职场建议", "把颜色用起来", dim.c, y + 22);
  ctx.fillStyle = dim.deep; ctx.font = "700 13.5px " + FONT;
  ctx.fillText("在团队中", PAD + 24, cy); cy += 24;
  ctx.fillStyle = "#4E4740"; ctx.font = "400 13.5px " + FONT;
  workLines.forEach(t => { ctx.fillText(t, PAD + 24, cy); cy += 24; });
  cy += 10;
  ctx.fillStyle = dim.deep; ctx.font = "700 13.5px " + FONT;
  ctx.fillText("在关系里", PAD + 24, cy); cy += 24;
  ctx.fillStyle = "#4E4740"; ctx.font = "400 13.5px " + FONT;
  relLines.forEach(t => { ctx.fillText(t, PAD + 24, cy); cy += 24; });
  y += c4h + 24;

  /* 页脚 */
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.fillStyle = "#C0B6A8"; ctx.font = "400 12px " + FONT;
  ctx.fillText("报告密码可在首页随时查询本报告 · XXX公司 · 色彩性格测试", W / 2, y);
  y += 30;

  /* 裁剪输出 */
  const out = document.createElement("canvas");
  out.width = W * SC;
  out.height = Math.min(Math.ceil(y + 30), HMAX) * SC;
  const octx = out.getContext("2d");
  octx.drawImage(tmp, 0, 0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}


function exportPNG(rec){
  try{
    const cv = buildReportCanvas(rec);
    const name = "性格色彩测试报告_" + rec.name + "_" + fileStamp(rec.time) + ".png";
    if(cv.toBlob){
      cv.toBlob(b => {
        if(b){ downloadBlob(b, name); toast("图片报告已开始下载"); }
        else { toast("图片生成失败，请重试"); }
      }, "image/png");
    }else{
      const data = cv.toDataURL("image/png").split(",")[1];
      const bin = atob(data);
      const u8 = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      downloadBlob(new Blob([u8], {type:"image/png"}), name);
      toast("图片报告已开始下载");
    }
  }catch(e){
    toast("当前浏览器不支持图片导出");
  }
}

    '<p style="margin:0 0 6px;text-align:justify"><b>在团队中：</b>' + esc(r.p.work) + '</p>' +
    '<p style="margin:0 0 6px;text-align:justify"><b>在关系里：</b>' + esc(r.p.relation) + '</p>' +

    '<div style="margin-top:12px;padding-top:6px;border-top:1px solid #EDE6DC;font-size:10px;color:#A99E90">' +
      '本工具本地离线使用，服务模式下记录保存在主机，离线打开时仅保存在本机。</div>' +
  '</div>';
}


function exportPDF(rec){
  const root = $("#printRoot");
  root.innerHTML = buildPrintHTML(rec);
  toast("已打开打印窗口，请在「目标打印机」中选择“另存为 PDF”");
  setTimeout(() => {
    try{
      window.print();
    }catch(e){
      toast("无法调起打印，请使用浏览器菜单中的“打印”");
    }
  }, 420);
}

/* =========================================================
   管理员列表
   ========================================================= */
function renderAdminList(){
  const box = $("#rlist");

  // 局域网服务模式：从主机拉取全部记录（含所有扫码设备）
  if(SERVER){
    $("#admCount").textContent = "";
    box.innerHTML = '<div class="empty"><div class="big">◌</div><p>正在从主机读取记录…</p></div>';
    fetch("api/records", {headers: {"X-Admin-Pwd": adminPwd}, cache: "no-store"})
      .then(r => {
        if(r.status === 401) throw new Error("auth");
        if(!r.ok) throw new Error("status " + r.status);
        return r.json();
      })
      .then(list => {
        serverRecords = Array.isArray(list) ? list : [];
        paintAdminList(serverRecords, true);
        startAdminPoll();
      })
      .catch(e => {
        if(e.message === "auth"){
          toast("主机校验未通过，请重新输入密码");
          adminPwd = "";
          forgetAdmin();
          viewerMode = "user";
          show("screen-home");
          return;
        }
        currentList = loadRecords();
        paintAdminList(currentList, false);
        toast("无法连接主机服务，已显示本机记录");
      });
    return;
  }

  currentList = loadRecords();
  paintAdminList(currentList, false);
}

function paintAdminList(all, fromServer){
  currentList = Array.isArray(all) ? all : []; // 修复：操作按钮按 id 从 currentList 取记录
  if(fromServer) admListSig = currentList.map(r => r.id).join(",");
  const box = $("#rlist");
  $("#admCount").textContent = "共 " + all.length + " 条" + (fromServer ? " · 来自主机" : " · 本机");

  if(!all.length){
    box.innerHTML = fromServer
      ? '<div class="empty"><div class="big">○</div><p>主机上还没有测试记录<br>其他设备扫码完成测试后，记录会自动同步到这里</p></div>'
      : '<div class="empty"><div class="big">○</div><p>暂无测试记录<br>所有答题记录会保存在本机浏览器中</p></div>';
    return;
  }

  box.innerHTML = all.map(rec => {
    const dim = DIM_MAP[rec.primary];
    const p = PROFILES[rec.primary];
    return '<div class="row-item" data-id="' + esc(rec.id) + '">' +
      '<div class="avat" style="background:linear-gradient(145deg,' + dim.c + ',' + dim.c + 'CC)">' +
        esc((rec.name || "匿").slice(0,1)) + '</div>' +
      '<div class="rmain">' +
        '<div class="rname">' + esc(rec.name) +
          '<span class="badge" style="background:' + dim.soft + ';color:' + dim.c + '">' +
            dim.name + ' · ' + rec.scores[rec.primary] + '分</span>' +
        '</div>' +
        '<div class="rsub">' + fmtTime(rec.time) + '　·　' + esc(p.label.split(" · ")[1] || "") + '</div>' +
        (rec.key ?
        '<div class="rkey">报告密码 <b>' + esc(String(rec.key).toUpperCase()) + '</b>' +
          '<button class="mini kcopy" data-act="copykey">复制发给本人</button></div>' : '') +
      '</div>' +
      '<div class="racts">' +
        '<button class="mini" data-act="view">完整报告</button>' +
        '<button class="mini" data-act="png">PNG</button>' +
        '<button class="mini" data-act="pdf">PDF</button>' +
        '<button class="mini danger" data-act="del">删除</button>' +
      '</div>' +
    '</div>';
  }).join("");

  box.onclick = (e) => {
    const btn = e.target.closest("button[data-act]");
    if(!btn) return;
    const row = btn.closest(".row-item");
    const id = row.getAttribute("data-id");
    const rec = currentList.find(r => r.id === id);
    if(!rec) return;
    const act = btn.getAttribute("data-act");
    if(act === "view"){ renderResult(rec, "admin"); show("screen-result"); }
    else if(act === "png"){ exportPNG(rec); }
    else if(act === "pdf"){ exportPDF(rec); }
    else if(act === "copykey"){ copyText(String(rec.key || "").toUpperCase()); }
    else if(act === "del"){
      confirmDialog("删除这条记录？", "将删除「" + rec.name + "」的测试记录，删除后无法恢复。", "删除").then(ok => {
        if(!ok) return;
        if(fromServer && SERVER){
          fetch("api/records/" + encodeURIComponent(id), {
            method: "DELETE",
            headers: {"X-Admin-Pwd": adminPwd}
          }).then(r => {
            if(!r.ok) throw new Error("status " + r.status);
            renderAdminList();
            toast("记录已删除");
          }).catch(() => toast("删除失败，无法连接主机"));
        }else{
          const arr = loadRecords().filter(r => r.id !== id);
          saveRecords(arr);
          renderAdminList();
          toast("记录已删除");
        }
      });
    }
  };
}

$("#btnAdmBack").addEventListener("click", () => show("screen-home"));
$("#btnPwd").addEventListener("click", openPwdModal);

/* 管理后台自动刷新：每5秒拉取主机记录，有变化且停留在列表页时才重绘 */
let admPollTimer = null;
let admListSig = "";
function startAdminPoll(){
  if(admPollTimer) return;
  admPollTimer = setInterval(() => {
    if(!SERVER || !adminPwd) return;
    if(!$("#screen-admin").classList.contains("on")) return;
    if($("#mask").classList.contains("on")) return; // 弹窗打开时不刷新，避免打断操作
    fetch("api/records", {headers: {"X-Admin-Pwd": adminPwd}, cache: "no-store"})
      .then(r => {
        if(r.status === 401){ stopAdminPoll(); forgetAdmin(); adminPwd = ""; viewerMode = "user"; return null; }
        return r.ok ? r.json() : null;
      })
      .then(list => {
        if(!Array.isArray(list)) return;
        serverRecords = list;
        const sig = list.map(r => r.id).join(",");
        if(sig !== admListSig){
          admListSig = sig;
          paintAdminList(list, true);
        }
      })
      .catch(()=>{});
  }, 5000);
}
function stopAdminPoll(){
  if(admPollTimer){ clearInterval(admPollTimer); admPollTimer = null; }
}

$("#btnExportAll").addEventListener("click", () => {
  const all = currentList && currentList.length ? currentList : loadRecords();
  if(!all.length){ toast("暂无可导出的记录"); return; }
  const scope = SERVER && adminPwd ? "主机全部记录" : "本机记录";
  const head = "性格色彩测试 · 全部记录导出（" + scope + "）\r\n导出时间：" + fmtTime(Date.now()) +
    "\r\n记录数量：" + all.length + " 条\r\n\r\n";
  const body = all.map((rec, i) =>
    "████████ 第 " + (i + 1) + " 条 / 共 " + all.length + " 条 ████████\r\n\r\n" + buildTXT(rec)
  ).join("\r\n\r\n\r\n");
  downloadBlob(new Blob(["\ufeff" + head + body], {type:"text/plain;charset=utf-8"}),
    "性格色彩测试_全部记录_" + fileStamp(Date.now()) + ".txt");
  toast("已导出全部 " + all.length + " 条记录");
});

$("#btnClearAll").addEventListener("click", () => {
  // 服务模式：清空主机上的全部记录（并清本机缓存）
  if(SERVER){
    if(!serverRecords || !serverRecords.length){
      // 主机记录可能尚未拉取，先确认一次
      fetch("api/records", {headers: {"X-Admin-Pwd": adminPwd}, cache: "no-store"})
        .then(r => r.ok ? r.json() : [])
        .then(list => {
          serverRecords = Array.isArray(list) ? list : [];
          if(!serverRecords.length){ toast("暂无记录"); return; }
          doClearServer(serverRecords.length);
        })
        .catch(() => toast("无法连接主机服务"));
    }else{
      doClearServer(serverRecords.length);
    }
    return;
  }
  const all = loadRecords();
  if(!all.length){ toast("暂无记录"); return; }
  confirmDialog("清空全部记录？", "将删除本机保存的全部 " + all.length + " 条测试记录，操作不可恢复。建议先导出备份。", "确认清空")
    .then(ok => {
      if(!ok) return;
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      renderAdminList();
      toast("已清空全部记录");
    });
});

function doClearServer(n){
  confirmDialog("清空全部记录？", "将删除主机上保存的全部 " + n + " 条测试记录（含所有设备），操作不可恢复。建议先导出备份。", "确认清空")
    .then(ok => {
      if(!ok) return;
      fetch("api/records", {method: "DELETE", headers: {"X-Admin-Pwd": adminPwd}})
        .then(r => {
          if(!r.ok) throw new Error("status " + r.status);
          try{ localStorage.removeItem(STORE_KEY); }catch(e){}
          renderAdminList();
          toast("已清空主机上的全部记录");
        })
        .catch(() => toast("清空失败，无法连接主机"));
    });
}

/* =========================================================
   杂项
   ========================================================= */
document.addEventListener("keydown", e => {
  if(!$("#screen-quiz").classList.contains("on")) return;
  if($("#mask").classList.contains("on")) return;
  const tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  const k = e.key.toUpperCase();
  if(k === "A" || k === "B" || k === "C" || k === "D"){
    const idx = LETTERS.indexOf(k);
    const btns = $$("#opts .opt");
    if(btns[idx]) btns[idx].click();
  }else if(e.key === "ArrowLeft"){
    $("#btnPrev").click();
  }else if(e.key === "ArrowRight"){
    $("#btnNext").click();
  }
});

// 阻止拖拽文件到页面导致的跳转
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
